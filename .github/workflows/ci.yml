name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend solution
        run: dotnet restore backend.slnx

      - name: Run backend tests
        run: dotnet test backend.slnx --nologo --configuration Release

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:5154
        run: |
          cd frontend
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          VITE_API_BASE_URL: http://localhost:5154
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          cd frontend
          npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - e2e
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          missing=0

          if [ -z "$BACKEND_DEPLOY_HOOK" ]; then
            echo "Missing GitHub secret: RENDER_BACKEND_DEPLOY_HOOK_URL"
            missing=1
          fi

          if [ -z "$FRONTEND_DEPLOY_HOOK" ]; then
            echo "Missing GitHub secret: RENDER_FRONTEND_DEPLOY_HOOK_URL"
            missing=1
          fi

          if [ -z "$PUBLIC_APP_URL" ]; then
            echo "Missing GitHub variable: PUBLIC_APP_URL"
            missing=1
          fi

          if [ -z "$PUBLIC_API_URL" ]; then
            echo "Missing GitHub variable: PUBLIC_API_URL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Add the Render deploy hooks and public URLs in GitHub before the deployment job can run."
            exit 1
          fi

      - name: Trigger backend deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          curl --fail --silent --show-error "$DEPLOY_URL"
          echo "Triggered backend deploy for $PUBLIC_API_URL"

      - name: Trigger frontend deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          curl --fail --silent --show-error "$DEPLOY_URL"
          echo "Triggered frontend deploy for $PUBLIC_APP_URL"
